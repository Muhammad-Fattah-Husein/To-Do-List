<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-do List</title>
    <link rel="shortcut icon" href="assets/images/Logo.png" type="image/png">
    <!-- Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/style.css">
</head>

<body>
    <div class="container">
        <div class="todo-app">
            <h2>To-do List <img src="assets/images/Logo.png" alt="To-do Logo"></h2>
            
            <div class="row">
                <input type="text" id="input-box" placeholder="Add your task" autocomplete="off" spellcheck="false">
                <button id="add-btn" type="button">Add</button>
            </div>

            <ul id="list-container">
                <!-- Tasks will appear here -->
            </ul>

            <div class="todo-footer" id="todo-footer">
                <span id="task-count">0 tasks left</span>
                <button id="clear-all" type="button">Clear All</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
